<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Language Translator</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f3;
      color: #1a1a18;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 820px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 500;
      color: #1a1a18;
    }

    .header i {
      font-size: 26px;
      color: #888780;
    }

    /* Language selectors row */
    .lang-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1rem;
    }

    select {
      flex: 1;
      height: 38px;
      border: 0.5px solid #c8c6be;
      border-radius: 8px;
      background: #fff;
      padding: 0 12px;
      font-size: 14px;
      color: #1a1a18;
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s;
    }

    select:hover { border-color: #888780; }
    select:focus { border-color: #534AB7; box-shadow: 0 0 0 3px rgba(83,74,183,0.12); }

    .swap-btn {
      background: #f1efe8;
      border: 0.5px solid #c8c6be;
      border-radius: 8px;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #888780;
      font-size: 20px;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }

    .swap-btn:hover { background: #d3d1c7; color: #1a1a18; }

    /* Translation panels */
    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 1rem;
    }

    @media (max-width: 600px) {
      .panels { grid-template-columns: 1fr; }
    }

    .panel {
      background: #fff;
      border: 0.5px solid #d3d1c7;
      border-radius: 12px;
      overflow: hidden;
    }

    .panel-label {
      font-size: 11px;
      color: #888780;
      padding: 8px 12px 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel textarea {
      width: 100%;
      border: none;
      background: transparent;
      resize: none;
      padding: 8px 12px 12px;
      font-size: 15px;
      font-family: inherit;
      color: #1a1a18;
      min-height: 180px;
      outline: none;
      line-height: 1.6;
    }

    .out-text {
      padding: 8px 12px 12px;
      font-size: 15px;
      color: #1a1a18;
      line-height: 1.6;
      min-height: 180px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .out-placeholder { color: #b4b2a9; }

    .panel-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px 10px;
      border-top: 0.5px solid #e8e6e0;
    }

    .char-count { font-size: 12px; color: #b4b2a9; }

    /* Icon buttons */
    .icon-btn {
      background: none;
      border: 0.5px solid #d3d1c7;
      border-radius: 8px;
      padding: 5px 12px;
      cursor: pointer;
      font-size: 13px;
      color: #888780;
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: inherit;
      transition: background 0.15s, color 0.15s;
    }

    .icon-btn:hover { background: #f1efe8; color: #1a1a18; }
    .icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Action row */
    .action-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 0.75rem;
    }

    .translate-btn {
      flex: 1;
      background: #fff;
      border: 0.5px solid #c8c6be;
      border-radius: 8px;
      padding: 11px 20px;
      font-size: 15px;
      font-weight: 500;
      color: #1a1a18;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
      transition: background 0.15s;
    }

    .translate-btn:hover:not(:disabled) { background: #f1efe8; }
    .translate-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .tts-btn {
      background: #fff;
      border: 0.5px solid #c8c6be;
      border-radius: 8px;
      padding: 11px 15px;
      cursor: pointer;
      font-size: 20px;
      color: #888780;
      display: flex;
      align-items: center;
      font-family: inherit;
      transition: background 0.15s, color 0.15s;
    }

    .tts-btn:hover:not(:disabled) { background: #f1efe8; color: #1a1a18; }
    .tts-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Status bar */
    .status-bar {
      font-size: 13px;
      color: #888780;
      min-height: 20px;
      text-align: center;
    }

    .status-bar.error { color: #a32d2d; }
    .status-bar.success { color: #3b6d11; }

    /* Detect badge */
    .detect-badge {
      font-size: 11px;
      background: #e6f1fb;
      color: #185fa5;
      border-radius: 8px;
      padding: 2px 8px;
      display: none;
    }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #d3d1c7;
      border-top-color: #888780;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: -2px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <i class="ti ti-language" aria-hidden="true"></i>
    <h1>Language Translator</h1>
  </div>

  <!-- Language selector row -->
  <div class="lang-row">
    <select id="srcLang">
      <option value="auto">Detect language</option>
      <option value="English">English</option>
      <option value="Spanish">Spanish</option>
      <option value="French">French</option>
      <option value="German">German</option>
      <option value="Italian">Italian</option>
      <option value="Portuguese">Portuguese</option>
      <option value="Russian">Russian</option>
      <option value="Chinese (Simplified)">Chinese (Simplified)</option>
      <option value="Chinese (Traditional)">Chinese (Traditional)</option>
      <option value="Japanese">Japanese</option>
      <option value="Korean">Korean</option>
      <option value="Arabic">Arabic</option>
      <option value="Hindi">Hindi</option>
      <option value="Bengali">Bengali</option>
      <option value="Urdu">Urdu</option>
      <option value="Turkish">Turkish</option>
      <option value="Dutch">Dutch</option>
      <option value="Polish">Polish</option>
      <option value="Swedish">Swedish</option>
      <option value="Greek">Greek</option>
      <option value="Hebrew">Hebrew</option>
      <option value="Thai">Thai</option>
      <option value="Vietnamese">Vietnamese</option>
      <option value="Indonesian">Indonesian</option>
    </select>

    <button class="swap-btn" id="swapBtn" title="Swap languages" aria-label="Swap languages">
      <i class="ti ti-arrows-exchange" aria-hidden="true"></i>
    </button>

    <select id="tgtLang">
      <option value="Spanish">Spanish</option>
      <option value="French">French</option>
      <option value="German">German</option>
      <option value="Italian">Italian</option>
      <option value="Portuguese">Portuguese</option>
      <option value="Russian">Russian</option>
      <option value="Chinese (Simplified)">Chinese (Simplified)</option>
      <option value="Chinese (Traditional)">Chinese (Traditional)</option>
      <option value="Japanese">Japanese</option>
      <option value="Korean">Korean</option>
      <option value="Arabic">Arabic</option>
      <option value="Hindi">Hindi</option>
      <option value="Bengali">Bengali</option>
      <option value="Urdu">Urdu</option>
      <option value="Turkish">Turkish</option>
      <option value="Dutch">Dutch</option>
      <option value="Polish">Polish</option>
      <option value="Swedish">Swedish</option>
      <option value="Greek">Greek</option>
      <option value="Hebrew">Hebrew</option>
      <option value="Thai">Thai</option>
      <option value="Vietnamese">Vietnamese</option>
      <option value="Indonesian">Indonesian</option>
      <option value="English">English</option>
    </select>
  </div>

  <!-- Text panels -->
  <div class="panels">
    <div class="panel">
      <div class="panel-label">Source text</div>
      <textarea id="srcText" placeholder="Enter text to translate…" maxlength="5000"></textarea>
      <div class="panel-footer">
        <span class="char-count" id="charCount">0 / 5000</span>
        <button class="icon-btn" id="clearBtn" aria-label="Clear input">
          <i class="ti ti-trash" aria-hidden="true"></i> Clear
        </button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-label">
        Translation
        <span class="detect-badge" id="detectBadge">auto-detected</span>
      </div>
      <div class="out-text out-placeholder" id="outText">Translation will appear here…</div>
      <div class="panel-footer">
        <span></span>
        <button class="icon-btn" id="copyBtn" aria-label="Copy translation" disabled>
          <i class="ti ti-copy" aria-hidden="true"></i> Copy
        </button>
      </div>
    </div>
  </div>

  <!-- Actions -->
  <div class="action-row">
    <button class="translate-btn" id="translateBtn" disabled>
      <i class="ti ti-world" aria-hidden="true"></i> Translate
    </button>
    <button class="tts-btn" id="ttsBtn" title="Listen to translation" aria-label="Listen to translation" disabled>
      <i class="ti ti-volume" aria-hidden="true"></i>
    </button>
  </div>

  <div class="status-bar" id="statusBar"></div>
</div>

<script>
  const srcText     = document.getElementById('srcText');
  const outText     = document.getElementById('outText');
  const srcLang     = document.getElementById('srcLang');
  const tgtLang     = document.getElementById('tgtLang');
  const translateBtn= document.getElementById('translateBtn');
  const copyBtn     = document.getElementById('copyBtn');
  const clearBtn    = document.getElementById('clearBtn');
  const ttsBtn      = document.getElementById('ttsBtn');
  const charCount   = document.getElementById('charCount');
  const statusBar   = document.getElementById('statusBar');
  const detectBadge = document.getElementById('detectBadge');

  // ─── NOTE ────────────────────────────────────────────────────────────────────
  // Replace the empty string below with your actual Anthropic API key.
  // Get one at: https://console.anthropic.com/
  // NEVER commit a real key to a public repository.
  // ─────────────────────────────────────────────────────────────────────────────
  const ANTHROPIC_API_KEY = 'YOUR_ANTHROPIC_API_KEY_HERE';

  let translatedText = '';
  let speaking = false;

  // Character counter
  srcText.addEventListener('input', () => {
    const len = srcText.value.length;
    charCount.textContent = `${len} / 5000`;
    translateBtn.disabled = len === 0;
  });

  // Clear button
  clearBtn.addEventListener('click', () => {
    srcText.value = '';
    charCount.textContent = '0 / 5000';
    translateBtn.disabled = true;
    outText.textContent = 'Translation will appear here…';
    outText.classList.add('out-placeholder');
    copyBtn.disabled = true;
    ttsBtn.disabled = true;
    translatedText = '';
    detectBadge.style.display = 'none';
    statusBar.textContent = '';
    statusBar.className = 'status-bar';
  });

  // Swap languages
  document.getElementById('swapBtn').addEventListener('click', () => {
    const srcVal = srcLang.value;
    if (srcVal === 'auto') return;
    const tgtVal = tgtLang.value;
    srcLang.value = tgtVal;
    tgtLang.value = srcVal;
    if (translatedText) {
      srcText.value = translatedText;
      charCount.textContent = `${srcText.value.length} / 5000`;
      outText.textContent = 'Translation will appear here…';
      outText.classList.add('out-placeholder');
      translatedText = '';
      copyBtn.disabled = true;
      ttsBtn.disabled = true;
      detectBadge.style.display = 'none';
    }
  });

  // Translate button
  translateBtn.addEventListener('click', async () => {
    const text = srcText.value.trim();
    if (!text) return;

    const src = srcLang.value;
    const tgt = tgtLang.value;

    translateBtn.disabled = true;
    translateBtn.innerHTML = '<span class="spinner"></span> Translating…';
    statusBar.textContent = '';
    statusBar.className = 'status-bar';
    detectBadge.style.display = 'none';
    outText.textContent = '';
    outText.classList.remove('out-placeholder');
    copyBtn.disabled = true;
    ttsBtn.disabled = true;

    const prompt = src === 'auto'
      ? `Translate the following text to ${tgt}. Respond ONLY with the translated text — no explanations, no preamble, no quotes.\n\nText:\n${text}`
      : `Translate the following text from ${src} to ${tgt}. Respond ONLY with the translated text — no explanations, no preamble, no quotes.\n\nText:\n${text}`;

    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': ANTHROPIC_API_KEY,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          system: 'You are a professional translator. Always respond with ONLY the translated text — no explanations, no notes, no quotation marks.',
          messages: [{ role: 'user', content: prompt }]
        })
      });

      const data = await res.json();
      if (data.error) throw new Error(data.error.message);

      translatedText = (data.content || []).map(b => b.text || '').join('').trim();
      outText.textContent = translatedText;
      outText.classList.remove('out-placeholder');
      copyBtn.disabled = false;
      ttsBtn.disabled = false;

      if (src === 'auto') {
        detectBadge.style.display = 'inline-block';
      }

      statusBar.textContent = '✓ Translation complete';
      statusBar.className = 'status-bar success';
    } catch (err) {
      statusBar.textContent = 'Translation failed: ' + err.message;
      statusBar.className = 'status-bar error';
      outText.textContent = 'Translation will appear here…';
      outText.classList.add('out-placeholder');
    } finally {
      translateBtn.disabled = false;
      translateBtn.innerHTML = '<i class="ti ti-world" aria-hidden="true"></i> Translate';
    }
  });

  // Copy button
  copyBtn.addEventListener('click', () => {
    if (!translatedText) return;
    navigator.clipboard.writeText(translatedText).then(() => {
      copyBtn.innerHTML = '<i class="ti ti-check" aria-hidden="true"></i> Copied!';
      setTimeout(() => {
        copyBtn.innerHTML = '<i class="ti ti-copy" aria-hidden="true"></i> Copy';
      }, 1800);
    });
  });

  // Text-to-speech button
  const langMap = {
    'Spanish': 'es', 'French': 'fr', 'German': 'de', 'Italian': 'it',
    'Portuguese': 'pt', 'Russian': 'ru', 'Chinese (Simplified)': 'zh-CN',
    'Chinese (Traditional)': 'zh-TW', 'Japanese': 'ja', 'Korean': 'ko',
    'Arabic': 'ar', 'Hindi': 'hi', 'Bengali': 'bn', 'Urdu': 'ur',
    'Turkish': 'tr', 'Dutch': 'nl', 'Polish': 'pl', 'Swedish': 'sv',
    'Greek': 'el', 'Hebrew': 'he', 'Thai': 'th', 'Vietnamese': 'vi',
    'Indonesian': 'id', 'English': 'en'
  };

  ttsBtn.addEventListener('click', () => {
    if (!translatedText) return;
    if (speaking) {
      speechSynthesis.cancel();
      speaking = false;
      ttsBtn.innerHTML = '<i class="ti ti-volume" aria-hidden="true"></i>';
      return;
    }
    const utter = new SpeechSynthesisUtterance(translatedText);
    utter.lang = langMap[tgtLang.value] || 'en';
    speaking = true;
    ttsBtn.innerHTML = '<i class="ti ti-volume-off" aria-hidden="true"></i>';
    utter.onend = () => {
      speaking = false;
      ttsBtn.innerHTML = '<i class="ti ti-volume" aria-hidden="true"></i>';
    };
    utter.onerror = () => {
      speaking = false;
      ttsBtn.innerHTML = '<i class="ti ti-volume" aria-hidden="true"></i>';
    };
    speechSynthesis.speak(utter);
  });
</script>
</body>
</html>
